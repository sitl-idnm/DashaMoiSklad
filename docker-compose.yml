# Полный self-host стек на VDS: Postgres + приложение + воркер автосбора + nginx.
# Значения секретов берутся из .env рядом с этим файлом.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moisklad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}
      POSTGRES_DB: ${POSTGRES_DB:-moisklad}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-moisklad} -d ${POSTGRES_DB:-moisklad}']
      interval: 5s
      timeout: 5s
      retries: 10
    # Порт наружу не публикуем — доступ только из compose-сети.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-moisklad}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-moisklad}
      FILES_DIR: /data/files
      MOYSKLAD_LOGIN: ${MOYSKLAD_LOGIN}
      MOYSKLAD_PASSWORD: ${MOYSKLAD_PASSWORD}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET}
      WB_TOKEN_ENC_KEY: ${WB_TOKEN_ENC_KEY}
      CRON_SECRET: ${CRON_SECRET}
      TZ: Europe/Moscow
    volumes:
      - files:/data/files
    # Порт наружу отдаёт nginx; для отладки можно раскомментировать:
    # ports:
    #   - '3000:3000'

  worker:
    build: .
    restart: unless-stopped
    depends_on:
      - app
    command: ['node', 'scripts/worker.mjs']
    environment:
      APP_URL: http://app:3000
      CRON_SECRET: ${CRON_SECRET}
      CRON_HOUR_MSK: ${CRON_HOUR_MSK:-11}
      CRON_MIN_MSK: ${CRON_MIN_MSK:-5}
      TZ: Europe/Moscow

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      # Для TLS повесьте сюда 443 и смонтируйте сертификаты + допишите server{} в nginx.conf.
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
  files:
