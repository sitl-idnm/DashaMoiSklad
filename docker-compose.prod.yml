# moi-sklad (aqua.kimprod.ru) — ПРОДАКШН за общим edge-прокси Caddy.
#
# Паттерн как у РАДАРа: наружу НИЧЕГО не публикуем (ни 3000, ни 5432) — трафик идёт
# только через общую docker-сеть edge. Домен → aqua_web:3000 задаёт edge Caddyfile
# (по заголовку Host). TLS терминирует коллега выше по потоку.
#
# Один раз на сервере: docker network create edge  (уже создана под РАДАР).
# Запуск:   docker compose -f docker-compose.prod.yml up -d --build
# Секреты — в .env рядом с файлом (POSTGRES_PASSWORD, MOYSKLAD_*, AUTH_SESSION_SECRET,
# WB_TOKEN_ENC_KEY, CRON_SECRET). Миграции применяются в entrypoint автоматически.

services:
  db:
    image: postgres:16-alpine
    container_name: aqua_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moisklad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-moisklad}
    volumes:
      - aqua_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-moisklad} -d ${POSTGRES_DB:-moisklad}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  app:
    build: .
    container_name: aqua_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-moisklad}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-moisklad}
      FILES_DIR: /data/files
      MOYSKLAD_LOGIN: ${MOYSKLAD_LOGIN}
      MOYSKLAD_PASSWORD: ${MOYSKLAD_PASSWORD}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET}
      WB_TOKEN_ENC_KEY: ${WB_TOKEN_ENC_KEY}
      CRON_SECRET: ${CRON_SECRET}
      TZ: Europe/Moscow
      # Next standalone на мультисети должен слушать все интерфейсы, иначе Caddy на
      # edge-IP получает connection refused (см. РАДАР).
      HOSTNAME: 0.0.0.0
      PORT: '3000'
    volumes:
      - aqua_files:/data/files
    # internal — общение с db; edge — общий Caddy находит контейнер по имени aqua_web:3000.
    networks: [internal, edge]

  worker:
    build: .
    container_name: aqua_worker
    restart: unless-stopped
    depends_on:
      - app
    command: ['node', 'scripts/worker.mjs']
    environment:
      APP_URL: http://app:3000
      CRON_SECRET: ${CRON_SECRET}
      CRON_HOUR_MSK: ${CRON_HOUR_MSK:-11}
      CRON_MIN_MSK: ${CRON_MIN_MSK:-5}
      SHIP_HOUR_MSK: ${SHIP_HOUR_MSK:-11}
      SHIP_MIN_MSK: ${SHIP_MIN_MSK:-2}
      TZ: Europe/Moscow
    networks: [internal]

volumes:
  aqua_pg:
  aqua_files:

networks:
  internal:
  edge:
    external: true
    name: edge
